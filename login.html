<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoring Listrik Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, var(--secondary-bg) 0%, var(--primary-bg) 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 1rem;
        }
    </style>
</head> 
<body>

    <div class="glass login-card fade-in relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-pulse"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-pulse" style="animation-delay: 2s;"></div>
        
        <div class="relative z-10 text-center mb-8">
            <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-500/30">
                <i class="fa-solid fa-bolt text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Welcome Back</h1>
            <p class="text-sm text-gray-400">Login to access monitoring dashboard</p>
        </div>

        <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded-lg mb-6 text-center"></div>

        <form id="login-form" class="relative z-10 flex flex-col gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="username" class="w-full pl-10" placeholder="admin" required>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" class="w-full pl-10" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full mt-4 flex justify-center items-center gap-2">
                Sign In <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
